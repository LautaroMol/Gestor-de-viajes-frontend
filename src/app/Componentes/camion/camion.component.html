<div class="container" *ngIf="unidad">
  <div class="layout">
    <!-- Contenedor del ícono de aceite y detalles -->
    <div class="oil-icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" height="100px" viewBox="0 -960 960 960" width="100px" 
           [ngStyle]="{'fill': oilBarrelColor, 'animation': oilAnimation}">
        <path d="M160-120q-17 0-28.5-11.5T120-160q0-17 11.5-28.5T160-200h40v-240h-40q-17 0-28.5-11.5T120-480q0-17 11.5-28.5T160-520h40v-240h-40q-17 0-28.5-11.5T120-800q0-17 11.5-28.5T160-840h640q17 0 28.5 11.5T840-800q0 17-11.5 28.5T800-760h-40v240h40q17 0 28.5 11.5T840-480q0 17-11.5 28.5T800-440h-40v240h40q17 0 28.5 11.5T840-160q0 17-11.5 28.5T800-120H160Zm120-80h400v-240q-17 0-28.5-11.5T640-480q0-17 11.5-28.5T680-520v-240H280v240q17 0 28.5 11.5T320-480q0 17-11.5 28.5T280-440v240Zm200-120q50 0 85-34.5t35-83.5q0-39-22.5-67T480-620q-75 86-97.5 114.5T360-438q0 49 35 83.5t85 34.5ZM280-200v-560 560Z"/>
      </svg>
      <div class="oil-details">
        <p>Fecha de último cambio de aceite: {{ unidad.aceite | date }}</p>
        <p>Kilómetros recorridos con el aceite: {{ unidad.kmAceite }}</p>
        <p *ngIf="showWarning" class="warning">¡Atención! El aceite ha recorrido {{ unidad.kmAceite }} km.</p>
      </div>
    </div>

    
      <div *ngIf="selectedWheel !== null">
        <p>Rueda elegida: {{ selectedWheel + 1 }}</p>
        <p>Kilómetros recorridos: {{ unidad.estadoRueda[selectedWheel] }}</p>
      </div>

      <div>
        <label for="wheelSelect">Seleccionar Rueda:</label>
        <select id="wheelSelect" (change)="onWheelSelect($event)">
          <option *ngFor="let wheel of unidad.ruedas; let i = index" [value]="i">
            Rueda {{ i + 1 }}
          </option>
        </select>
      </div>
    </div>
    <div class="truck">
      <div class="cab"></div>
      <div class="trailer"></div>
      <div
        *ngFor="let wheel of unidad.ruedas; let i = index"
        class="wheel"
        [ngClass]="{
          'selected': selectedWheel === i,
          'front-left': i === 0,
          'front-right': i === 1,
          'rear-left': i === 2,
          'rear-right': i === 3,
          'back-left': i === 4,
          'back-right': i === 5
        }"
        (click)="selectWheel(i)"
      >
      </div>
    </div>
  </div>
