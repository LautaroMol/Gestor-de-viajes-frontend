<div class="flex justify-center">
    <div class="bg-white p-4 text-center rounded-lg shadow-md w-1/2">
        <p class="font-black text-2xl text-indigo-600 mb-0">Últimos Gastos</p>
    </div>
</div>

<section class="">

    <div class="flex justify-around p-4 overflow-hidden bg-white rounded-lg shadow-md mt-8">

        <ngx-charts-advanced-pie-chart 
            [view]="view"
            [results]="single"
            [gradient]="gradient"
            (select)="onSelect($event)"
        >
        </ngx-charts-advanced-pie-chart>

        <div class="flex flex-col justify-between pr-20">
            <div>
                <p class="font-black text-xl text-center text-indigo-600">Seleccionar Viaje</p>
                <select (change)="onViajeChange($event)" class="mt-2 p-2">
                    <option *ngFor="let viaje of viajes" [value]="viaje.idViaje">{{ viaje.inicio }} - {{ viaje.final }}</option>
                </select> 
            </div>
            <button (click)="nuevoGasto()" class="bg-indigo-600 px-4 py-2 font-bold text-white rounded-lg hover:bg-indigo-700 w-full">
                Nuevo gasto
            </button>
        </div>
    </div>

    <div>
        <div *ngIf="categoriaSeleccionadaNombre" class="mt-3">
            <h3 class="text-lg font-bold text-indigo-600"> {{ categoriaSeleccionadaNombre }}</h3>
        </div>

        <div class="overflow-y-auto grid grid-cols-2 gap-4 max-h-64 mt-2">    
            <div 
                class="flex items-center py-5 px-4 bg-white h-auto rounded-lg shadow-md font-bold min-w-0 cursor-pointer hover:bg-gray-300" 
                *ngFor="let gasto of gastosFiltrados"
            >
                <p class="text-red-600 font-black">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-9">
                        <path d="M10.464 8.746c.227-.18.497-.311.786-.394v2.795a2.252 2.252 0 0 1-.786-.393c-.394-.313-.546-.681-.546-1.004 0-.323.152-.691.546-1.004ZM12.75 15.662v-2.824c.347.085.664.228.921.421.427.32.579.686.579.991 0 .305-.152.671-.579.991a2.534 2.534 0 0 1-.921.42Z" />
                        <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v.816a3.836 3.836 0 0 0-1.72.756c-.712.566-1.112 1.35-1.112 2.178 0 .829.4 1.612 1.113 2.178.502.4 1.102.647 1.719.756v2.978a2.536 2.536 0 0 1-.921-.421l-.879-.66a.75.75 0 0 0-.9 1.2l.879.66c.533.4 1.169.645 1.821.75V18a.75.75 0 0 0 1.5 0v-.81a4.124 4.124 0 0 0 1.821-.749c.745-.559 1.179-1.344 1.179-2.191 0-.847-.434-1.632-1.179-2.191a4.122 4.122 0 0 0-1.821-.75V8.354c.29.082.559.213.786.393l.415.33a.75.75 0 0 0 .933-1.175l-.415-.33a3.836 3.836 0 0 0-1.719-.755V6Z" clip-rule="evenodd" />
                    </svg>
                </p>
                <div class="text-center flex-grow">
                    <p class="text-xl">{{ gasto.nombre }}</p>
                    <p class="text-xs">{{ gasto.fecha | date:'dd/MM/yyyy' }}</p>
                </div>
                <div class="flex items-center gap-3">
                    <p class="text-xl font-black">$ {{ gasto.cantidad | currency }}</p>
                    <div>
                        <span class="material-icons cursor-pointer mx-2 text-gray-400 hover:text-gray-500" (click)="editarGasto(gasto)">edit</span>
                        <span class="material-icons cursor-pointer mx-2 text-gray-400 hover:text-gray-500" (click)="borrarGasto(gasto)">delete</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
