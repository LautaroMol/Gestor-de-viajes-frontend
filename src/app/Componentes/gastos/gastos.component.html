<div class="flex justify-center">
    <div class="bg-white p-4 text-center rounded-lg shadow-md w-1/2">
        <p class="font-black text-2xl text-indigo-600 mb-0">Últimos Gastos</p>
    </div>
</div>

<section class="w-100">

    <div class="flex flex-col md:flex-row justify-between p-4 overflow-hidden bg-white rounded-lg shadow-md mt-8">

        <ngx-charts-advanced-pie-chart 
            [view]="view"
            [results]="single"
            [gradient]="gradient"
            (select)="onSelect($event)"
        >
        </ngx-charts-advanced-pie-chart>

        <div class="flex flex-col justify-between md:pr-20 w-100 md:w-auto">
            <div class="w-100">
                <p class="font-black text-xl text-center text-indigo-600">Seleccionar Viaje con destino en: </p>
                <select (change)="onViajeChange($event)" class="my-2 p-2 max-w-72 md:max-w-48">
                    <option *ngFor="let viaje of viajes" [value]="viaje.idViaje">{{ viaje.final }}</option>
                </select> 
            </div>
            <button (click)="nuevoGasto()" class="bg-indigo-600 px-4 py-2 font-bold text-white rounded-lg hover:bg-indigo-700 w-full">
                Nuevo gasto
            </button>
        </div>
    </div>

    <div>
        <div *ngIf="categoriaSeleccionadaNombre" class="mt-3">
            <h3 class="text-lg font-bold text-indigo-600"> {{ categoriaSeleccionadaNombre }}</h3>
        </div>

        <div class="overflow-y-auto flex flex-col md:grid md:grid-cols-2 gap-4 max-h-64 mt-2">    
            <div 
                class="flex items-center py-5 px-4 bg-white h-auto rounded-lg shadow-md font-bold min-w-0 cursor-pointer hover:bg-gray-300" 
                *ngFor="let gasto of gastosFiltrados"
            >
                <p class="text-xl font-black">{{ gasto.cantidad | currency }}</p>
                <div class="text-center flex-grow">
                    <p class="text-xl">{{ gasto.nombre }}</p>
                    <p class="text-xs">{{ gasto.fecha | date:'dd/MM/yyyy' }}</p>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Icono de editar -->
                    <span 
                        class="material-icons mx-2" 
                        [ngClass]="{
                          'text-gray-400 hover:text-gray-500 cursor-pointer': gasto.nombre !== 'Amortizacion',
                          'text-red-300 cursor-not-allowed': gasto.nombre === 'Amortizacion'
                        }"
                        (click)="gasto.nombre !== 'Amortizacion' ? editarGasto(gasto) : null"
                        [title]="gasto.nombre === 'Amortizacion' ? 'No se puede editar este gasto' : ''"
                    >
                        {{ gasto.nombre === 'Amortizacion' ? 'block' : 'edit' }}
                    </span>
                
                    <!-- Icono de borrar -->
                    <span 
                        class="material-icons mx-2" 
                        [ngClass]="{
                          'text-gray-400 hover:text-gray-500 cursor-pointer': gasto.nombre !== 'Amortizacion',
                          'text-red-300 cursor-not-allowed': gasto.nombre === 'Amortizacion'
                        }"
                        (click)="gasto.nombre !== 'Amortizacion' ? borrarGasto(gasto) : null"
                        [title]="gasto.nombre === 'Amortizacion' ? 'No se puede borrar este gasto' : ''"
                    >
                        {{ gasto.nombre === 'Amortizacion' ? 'block' : 'delete' }}
                    </span>
                </div>
                
            </div>
        </div>
    </div>
</section>
