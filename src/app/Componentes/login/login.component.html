<div class="card-container">
  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form action="" class="form-custom" [formGroup]="formLogin">

        <div *ngIf="usuarioExistente" class="welcome-message">
          Bienvenido {{ usuarioExistente.nombre }}, por favor inicie sesión.
        </div>


        <mat-form-field class="input-custom">
          <mat-label>Correo</mat-label>
          <input matInput type="email" formControlName="correo">
        </mat-form-field>
        <mat-form-field class="input-custom">
          <mat-label>Clave</mat-label>
          <input matInput type="password" formControlName="clave">
        </mat-form-field>

        <div class="flex">
          <button mat-flat-button color="primary" (click)="iniciarSesion()">Iniciar Sesión</button>

          <button *ngIf="!usuarioExistente" mat-flat-button color="warn" (click)="registrarse()" style="margin-left: 8px;">
            Registrarse
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
