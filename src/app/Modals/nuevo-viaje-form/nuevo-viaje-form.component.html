<div class="fixed z-50 inset-0 flex items-center justify-center overflow-hidden">
	<div class="fixed inset-0 transition-opacity">
		<div class="absolute inset-0 bg-black opacity-50"></div>
	</div>

	<div class="grid grid-cols-2 gap-5">
		<div class="bg-white rounded-lg text-left overflow-hidden transform transition-all sm:max-w-lg ">
			<form class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 rounded-lg" [formGroup]="formViaje" (ngSubmit)="onSubmit()">
				<div class="p-3">
					<label for="inicio" class="block text-indigo-600 font-bold">Inicio</label>
					<input 
						id="inicio" 
						name="inicio" 
						type="text"
						class="w-full mt-2 py-1 px-3 bg-gray-200 focus:outline-indigo-200 shadow-lg rounded-lg"
						formControlName="inicio" 
						required
					>
				</div>
				<div class="p-3">
					<label for="final" class="block text-indigo-600	font-bold">Final</label>
					<input 
						id="final" 
						name="final" 
						type="text"
						class="w-full mt-2 py-1 px-3 bg-gray-200 focus:outline-indigo-200 shadow-lg rounded-lg"
						formControlName="final" 
						required
					>
				</div>
				<div class="p-3">
					<label for="cuitUsuario" class="block text-indigo-600 font-bold">Cliente</label>
					<select 
						name="cuitUsuario" 
						id="cuitUsuario"
						class="w-full mt-2 py-1 px-3 bg-gray-200 focus:outline-indigo-200 shadow-lg rounded-lg"
						formControlName="cuitUsuario"
					>
						<option disabled >-- Selecciones --</option>
						<option>razonsoci</option>
					</select>
				</div>
				<div class="flex justify-between gap-3 p-3">
						<button 
							class="w-1/2 shadow-md text-white text-center font-bold bg-yellow-600 p-1 rounded-md hover:bg-yellow-700 transition-all"
							type="submit">
							{{ botonAccion }}
						</button>

						<button 
							class="w-1/2 shadow-md text-white text-center font-bold bg-red-600 p-1 rounded-md hover:bg-red-700 transition-all"
							type="button"
							(click)="onCancel()"	
						>Cancelar
						</button>
						
				</div>
			</form>
		</div>
		<div class="">
			<app-map class="h-full"></app-map>
		</div>
	</div>
</div>
